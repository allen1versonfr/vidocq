name: Build and release Vidocq
on:
  push:
    branches: [main]
    paths: ['version.py', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vidocq-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: python -m pip install -r requirements.txt pyinstaller==6.20.0
      - name: Generate Windows icon assets
        run: python scripts/build_icon.py
      - name: Test application and update recovery
        run: python -m unittest discover -s tests -v
      - name: Check live public index canaries
        run: python scripts/live_source_smoke.py
      - name: Validate frontend syntax
        run: |
          node --check ui/app.js
          node --check ui/investigation.js
          node --check ui/spiderfoot.js
          node --check ui/assisted.js
      - name: Build portable Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Vidocq --icon "build/assets/vidocq.ico" --add-data "build/assets;assets" --add-data "ui;ui" --add-data "source-catalog.json;." --add-data "docs/OSINT_FRAMEWORK_LICENSE.txt;." --add-data "scripts/local_ocr.ps1;scripts" --collect-all webview --collect-all phonenumbers --collect-all pypdfium2 launch.py
      - name: Test actual Windows executable, replacement, restart and rollback
        run: python scripts/windows_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vidocq-Windows-verified
          path: dist/Vidocq.exe
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py
