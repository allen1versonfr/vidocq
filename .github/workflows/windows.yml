name: Build and release Vidocq
on:
  push:
    branches: [main]
    paths: ['version.py', '.github/workflows/windows.yml']
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: vidocq-release
  cancel-in-progress: false
jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14'
      - name: Build pinned isolated collector companions and corresponding source
        run: python scripts/build_collectors.py
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install pinned build dependencies
        run: python -m pip install --require-hashes -r requirements-lock.txt
      - name: Generate Windows icon assets
        run: python scripts/build_icon.py
      - name: Test application and update recovery
        run: python -m unittest discover -s tests -v
      - name: Scan locked main dependencies in an isolated tool environment
        run: |
          python -m venv .test-data/security-env
          .test-data/security-env/Scripts/python.exe -m pip install pip-audit==2.10.1
          .test-data/security-env/Scripts/python.exe -m pip_audit -r requirements-lock.txt --no-deps --disable-pip --require-hashes --strict --format json --output .test-data/dependency-security.json
      - name: Check live public index canaries
        run: python scripts/live_source_smoke.py
      - name: Validate frontend syntax
        run: |
          node --check ui/app.js
          node --check ui/investigation.js
          node --check ui/spiderfoot.js
          node --check ui/assisted.js
          node --check ui/collectors.js
          node --check ui/review.js
          node --check ui/workbench.js
          node --check ui/local-ai.js
          node --check ui/automation.js
          node --check ui/research-workflow.js
          node --check browser-extension/popup.js
          node scripts/test_browser_capture.js
          npm install --prefix .test-data/dom-tests --ignore-scripts --no-audit --no-fund jsdom@26.1.0
          node scripts/test_research_ui.js
      - name: Build portable Windows executable
        run: python -m PyInstaller --noconfirm --clean --onefile --windowed --name Vidocq --icon "build/assets/vidocq.ico" --add-data "build/assets;assets" --add-data "ui;ui" --add-data "source-catalog.json;." --add-data "docs/OSINT_FRAMEWORK_LICENSE.txt;." --add-data "scripts/local_ocr.ps1;scripts" --add-data "scripts/burn_cleanup.ps1;scripts" --collect-all webview --collect-all phonenumbers --collect-all pypdfium2 --collect-all maigret --add-data "docs/MAIGRET_LICENSE.txt;docs" --add-data "docs/LOCAL_AI_LICENSES.txt;docs" launch.py
      - name: Test actual Windows executable, replacement, restart and rollback
        run: python scripts/windows_smoke.py
      - uses: actions/upload-artifact@v4
        with:
          name: Vidocq-Windows-verified
          path: dist/Vidocq.exe
      - name: Publish verified release
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
        run: python scripts/publish_release.py
